name: CI & Release Verification
on:
  push:
    branches: [main]
    tags: ['v*.*.*']
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  check:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15, macos-15-intel, macos-26]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - name: Typecheck and isolated filesystem regressions
        run: ./scripts/check.sh
  build:
    name: Universal candidate
    needs: check
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Build tested app and DMG
        run: ./scripts/build_dmg.sh
      - name: Verify artifact identity, signature and checksum
        run: ./scripts/verify_release.sh
      - uses: actions/upload-artifact@v4
        with:
          name: MacSlim-Universal-Candidate
          path: |
            dist/*.dmg
            dist/SHA256SUMS.txt
            dist/release-manifest.json
          if-no-files-found: error
